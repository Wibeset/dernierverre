name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regenerate every page from data/ and src/ (standard library only).
      # Preview images in assets/og/ need Chrome + macOS sips, so they are rendered locally and committed.
      - name: Build
        run: python3 tools/build.py

      # Publish the site only, not the sources and tooling.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' --exclude '.DS_Store' \
            --exclude 'src' --exclude 'data' --exclude 'tools' --exclude 'README.md'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
